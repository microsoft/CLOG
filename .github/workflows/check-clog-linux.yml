name: LINUX_TEST_BUILD_LTTNG

on:
  push:
    branches:
    - main
    - release/*
  pull_request:
    branches:
    - main
    - release/*

jobs:
  validate:
    name: Validate(Linux LTTNG)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

    - name: Setup .NET
      uses: actions/setup-dotnet@871f041373faaad213a635d9afb62905ec029bbb # v1.10.1
      with:
        dotnet-version: 8.0.x

    - run: |
         sudo apt-get update
         sudo apt-get install -y liblttng-ust-dev lttng-tools build-essential

    - name: Build CLOG and run Tests
      run: ./runTests.ps1
      working-directory: ./examples
      shell: pwsh
